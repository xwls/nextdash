<!DOCTYPE html>
<html lang="zh-CN"
      data-theme="{{.Theme}}"
      data-auto-dark-mode="{{if .AutoDarkMode}}true{{else}}false{{end}}"
      data-random-theme-mode="{{.RandomThemeMode}}"
      data-theme-pool="{{.ThemePoolCSV}}"
      data-custom-theme-ids="{{.CustomThemeIDsCSV}}"
      data-show-background-dots="{{if .ShowBackgroundDots}}true{{else}}false{{end}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="{{.ThemeColorMeta}}">
    <title>登录 · nextDash</title>
    <link rel="icon" href="/static/favicon.ico">
    <script src="/static/js/theme-utils.js"></script>
    <script src="/static/js/theme-loader.js"></script>
    <link rel="stylesheet" href="/api/theme.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body data-theme="{{.Theme}}" data-show-background-dots="{{if .ShowBackgroundDots}}true{{else}}false{{end}}">
    <a class="skip-link" href="#login-form">跳到登录表单</a>

    <main class="login-shell">
        <header class="login-header" aria-label="nextDash">
            <div class="brand-lockup">
                <span class="brand-mark" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </span>
                <span class="brand-name">nextDash</span>
            </div>
            <div class="access-state">
                <span class="access-state-dot" aria-hidden="true"></span>
                private workspace
            </div>
        </header>

        <div class="login-layout">
            <section class="login-panel" aria-labelledby="login-title">
                <div class="panel-topline">
                    <span>AUTH / ADMIN</span>
                    <span class="panel-index">01</span>
                </div>

                <div class="panel-heading">
                    <div class="panel-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path>
                        </svg>
                    </div>
                    <div>
                        <h2 id="login-title">管理员登录</h2>
                        <p>输入管理员凭据以解锁工作台。</p>
                    </div>
                </div>

                {{if .Error}}<div class="login-error" role="alert">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 7v6"></path>
                        <path d="M12 17h.01"></path>
                    </svg>
                    <span>{{.Error}}</span>
                </div>{{end}}

                <form id="login-form" action="/login" method="post" autocomplete="on">
                    <input type="hidden" name="next" value="{{.Next}}">

                    <div class="form-field">
                        <label for="username">
                            <span>用户名</span>
                            <small>USERNAME</small>
                        </label>
                        <div class="input-shell">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="12" cy="8" r="3.5"></circle>
                                <path d="M5 20a7 7 0 0 1 14 0"></path>
                            </svg>
                            <input id="username" name="username" type="text" value="{{.Username}}" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="输入用户名" required autofocus>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="password">
                            <span>密码</span>
                            <small>PASSWORD</small>
                        </label>
                        <div class="input-shell">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                            </svg>
                            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required>
                        </div>
                    </div>

                    <button type="submit">
                        <span>进入 Dashboard</span>
                        <span class="button-key" aria-hidden="true">↵</span>
                    </button>
                </form>

                <div class="panel-footer">
                    <span><i aria-hidden="true"></i> 受保护的管理员入口</span>
                    <span>nextDash</span>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
