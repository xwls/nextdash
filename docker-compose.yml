# Development Docker Compose — mounts ./static, ./templates, ./locales for live assets without rebuild.
# First create .env and set NEXTDASH_ADMIN_PASSWORD_HASH (see README.md).
services:
  nextdash:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      # Dev: serve latest JS/CSS/locales from disk (main.go prefers on-disk static/locales)
      - ./static:/app/static
      - ./locales:/app/locales
      - ./templates:/app/templates
    environment:
      PORT: "8080"
      NEXTDASH_ADMIN_USERNAME: ${NEXTDASH_ADMIN_USERNAME:-admin}
      NEXTDASH_ADMIN_PASSWORD_HASH: ${NEXTDASH_ADMIN_PASSWORD_HASH:?Set NEXTDASH_ADMIN_PASSWORD_HASH in .env}
      # Development only: the local URL is plain HTTP.
      NEXTDASH_AUTH_COOKIE_SECURE: "0"
      # Live static mounts: re-hash assets on every read so ?v= tokens track edits.
      NEXTDASH_STATIC_MUTABLE: "1"
      # Browser extension credential. Required only when using the extension.
      NEXTDASH_WRITE_TOKEN: ${NEXTDASH_WRITE_TOKEN:-}
      # - DISABLE_TELEMETRY=true
    restart: unless-stopped
    container_name: nextdash
